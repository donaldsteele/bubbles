    post:
      tags: [messages]
      operationId: postMessage
      summary: Post a message
      description: >-
        Idempotent per author by `nonce`: `201` for a new message, `200` with the stored message
        when the nonce was used before (in the same channel and thread; elsewhere `400` on
        `nonce`). Limited to 10 posts per second per user (burst 20) in addition to the
        per-session limit.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
