        default:
          $ref: "#/components/responses/Internal"

  /hooks/{token}:
    post:
      tags: [webhooks]
      operationId: postWebhook
      summary: Post a message or an alert through an incoming webhook
      description: |-
        Served at the server root, not under `/api/v1`. No authentication besides the secret
        token in the path (`bwh_...`, shown once when an admin creates the webhook); the
        network gate applies, the `Origin` check does not. An unknown or revoked token is
        `404`. The body is limited to 256 KiB and is either `application/json` or
        `application/x-www-form-urlencoded` with the JSON document in a `payload` field
        (Slack's legacy form). The answer is `200` with the plain text `ok`, like Slack.

        A document with an `alert` object is a native alert: `{"text"?, "username"?,
        "alert": {severity, title, text?, fields?, link?, dedupe_key, renotify_after_s?}}`.
        It goes through the alerts service with the webhook's pseudo-app as its source, in
        the webhook's channel, and repeats under one `dedupe_key` update one message.
        `username` does not apply to alerts.

        Every other document is read as the Slack subset: `text` (mrkdwn), `username`,
        `icon_emoji` (a `:shortcode:`, shown as an emoji prefix; `icon_url` is ignored),
        `attachments[]` (`color`, `pretext`, `title`, `title_link`, `text`, `fields`,
        `footer`, `ts`, `fallback`, `blocks`) and `blocks[]` (`header`, `section`,
        `divider`, `context`, `image` as a link, `actions` buttons that have a url as links;
        any other block leaves an `(unsupported block)` note). It is translated to Markdown
        without raw HTML: mrkdwn `<url|text>` becomes a link (http, https and mailto only),
        `*bold*`, `_italic_` and `~strike~` become Markdown, `&lt;`, `&gt;` and `&amp;`
        are decoded, and `<@U...>`, `<#C...>`, `<!channel>`, `<!here>`, `<!everyone>` and
        `<!subteam^...>` are removed. A message is stored without mentions whatever it
        says: no payload can notify anyone. `username` (control characters stripped, at
        most 64 characters) is only the display name of the message, shown by clients with
        a "webhook" badge; it never refers to a real user. A document that translates to
        nothing is `400`.

        Each webhook accepts 30 posts per minute (burst 10); over that, `429` with
        `Retry-After`.
      servers:
        - url: /
      security: []
      parameters:
        - $ref: "#/components/parameters/WebhookToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookPayload"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: The JSON document, as for `application/json`.
      responses:
        "200":
          description: Accepted.
          content:
            text/plain:
              schema:
                type: string
                enum: ["ok"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Request body larger than 256 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type is neither application/json nor application/x-www-form-urlencoded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/overview:
    get:
      tags: [admin]
      operationId: getAdminOverview
      summary: Server overview
      description: >-
        Admin only, browser session only. Version, uptime, user and connection counts, storage used,
        free disk space, the CA fingerprint and certificate expiry, the HTTPS and onboarding URLs
        and `client_isolation_hint` (true while no device other than the server itself has signed
        in).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/settings:
    get:
      tags: [admin]
      operationId: getAdminSettings
      summary: Read every setting
      description: >-
        Admin only, browser session only.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"
    patch:
      tags: [admin]
      operationId: updateAdminSettings
      summary: Change settings
      description: >-
        Admin only, browser session only. The body holds any of the setting keys; every value is
        validated first and either all are stored or none (`400` lists the rejected keys in
        `details.fields`). Audited (`settings.update`).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsPatch"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/users:
    get:
      tags: [admin]
      operationId: listAdminUsers
      summary: List accounts
      description: >-
        Admin only, browser session only. Human accounts, deactivated ones included.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/users/{id}:
    patch:
      tags: [admin]
      operationId: updateAdminUser
      summary: Change a role or (de)activate an account
      description: >-
        Admin only, browser session only. Deactivating ends every session, device token and app
        token of the user in the same transaction and closes their open sockets; messages stay.
        `409` when the change would leave no active admin or targets the caller. Audited.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/users/{id}/password-reset:
    post:
      tags: [admin]
      operationId: createPasswordReset
      summary: Create a one-time password-reset link
      description: >-
        Admin only, browser session only. The link is valid for 24 hours and appears in this answer
        only. Earlier unused links of the user stop working. Audited.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/users/{id}/sessions:
    delete:
      tags: [admin]
      operationId: revokeUserSessions
      summary: Sign a user out everywhere
      description: >-
        Admin only, browser session only. Ends every session and revokes every device token of the user; their sockets close.
        Audited.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/invites:
    get:
      tags: [admin]
      operationId: listAdminInvites
      summary: List invites
      description: >-
        Admin only, browser session only. Never includes the codes.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInviteList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"
    post:
      tags: [admin]
      operationId: createAdminInvite
      summary: Create an invite link
      description: >-
        Admin only, browser session only. The body is optional (member, 72 hours, one use). The link
        with its secret code appears in this answer only. Audited.
      security:
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/invites/{id}:
    delete:
      tags: [admin]
      operationId: revokeAdminInvite
      summary: Revoke an invite
      description: >-
        Admin only, browser session only. Idempotent. Audited.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/InviteId"
      responses:
        "204":
          description: Done.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/channels:
    get:
      tags: [admin]
      operationId: listAdminChannels
      summary: List public and private channels
      description: >-
        Admin only, browser session only. Names, settings and member counts of every public and
        private channel, whether or not the admin is a member. Never their content: admins cannot
        read private channels they are not in.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChannelList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/channels/{id}:
    patch:
      tags: [admin]
      operationId: updateAdminChannel
      summary: Change retention, default flag or archived state
      description: >-
        Admin only, browser session only. Works on public and private channels without membership
        (`404` for DMs). `retention_days` null keeps messages forever. Audited.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/ChannelId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminChannelRequest"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/audit:
    get:
      tags: [admin]
      operationId: listAudit
      summary: Read the audit log
      description: >-
        Admin only, browser session only. Newest first, optionally only one `action`; page with the
        opaque `cursor`.
      security:
        - cookieAuth: []
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor from `next_cursor`.
          schema: {type: string, maxLength: 100}
        - name: action
          in: query
          description: Only rows with exactly this action.
          schema: {type: string, maxLength: 64}
        - name: limit
          in: query
          description: Page size.
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/tls:
    get:
      tags: [admin]
      operationId: getAdminTLS
      summary: Certificate and CA status
      description: >-
        Admin only, browser session only. `ca_fingerprint` is empty in `byo` mode.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTLS"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /admin/tls/reissue:
    post:
      tags: [admin]
      operationId: reissueTLS
      summary: Re-issue the leaf certificate
      description: >-
        Admin only, browser session only. Issues a new leaf from the same CA for the current
        addresses; devices keep trusting it. `409` in `byo` mode. Audited.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTLS"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-bubbles_session
      description: Session cookie set by login, setup, invite accept and register.
    bearerAuth:
      type: http
      scheme: bearer
      description: An app token (`bub_...`) issued by an admin; see the Authentication note.
    deviceAuth:
      type: http
      scheme: bearer
      description: A tray device token (`bub_...`) from `POST /auth/device-login`; limited to the device routes.

  parameters:
    Code:
      name: code
      in: path
      required: true
      description: One-time invite or password-reset code from the link.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    UserId:
      name: id
      in: path
      required: true
      description: User id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    InviteId:
      name: id
      in: path
      required: true
      description: Invite id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    ChannelId:
      name: id
      in: path
      required: true
      description: Channel id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    MessageId:
      name: id
      in: path
      required: true
      description: Message id (a root message or a reply).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    MemberUserId:
      name: user_id
      in: path
      required: true
      description: User id of the member.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    PinMessageId:
      name: message_id
      in: path
      required: true
      description: Id of the message to pin or unpin.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Emoji:
      name: emoji
      in: path
      required: true
      description: |
        The emoji as one percent-encoded UTF-8 path segment, for example
        `%F0%9F%91%8D`. Multi-codepoint emoji (ZWJ sequences, skin tones, flags)
        are one reaction and round-trip unchanged. At most 64 bytes of UTF-8, which is
        at most 192 characters once percent-encoded.
      schema:
        type: string
        minLength: 1
        maxLength: 192
    Before:
      name: before
      in: query
      description: Page of items older than this id, newest last. Exclusive with `after` and `around`.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    After:
      name: after
      in: query
      description: Page of items newer than this id. Exclusive with `before` and `around`.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Around:
      name: around
      in: query
      description: Page centred on this id. Exclusive with `before` and `after`.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Limit:
      name: limit
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

    AlertId:
      name: id
      in: path
      required: true
      description: Id of the alert (its message id).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AppId:
      name: id
      in: path
      required: true
      description: App id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AppTokenId:
      name: token_id
      in: path
      required: true
      description: App token id (not the secret).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    PairingId:
      name: id
      in: path
      required: true
      description: Pairing request id.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    WebhookId:
      name: id
      in: path
      required: true
      description: Webhook id (not the secret token).
      schema:
        type: string
        minLength: 1
        maxLength: 64
    WebhookToken:
      name: token
      in: path
      required: true
      description: The webhook's secret token (`bwh_...`).
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PollSecret:
      name: X-Poll-Secret
      in: header
      required: true
      description: The poll secret returned when the request was created.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    SetCookie:
      description: Sets or clears `__Host-bubbles_session` (Secure; HttpOnly; SameSite=Strict; Path=/).
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1

  responses:
    SessionStarted:
      description: The account was signed in; the session cookie is set.
      headers:
        Set-Cookie:
          $ref: "#/components/headers/SetCookie"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponse"
    BadRequest:
      description: Malformed or invalid request. Validation failures list the fields in `details.fields`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: bad_request
              message: one or more fields are invalid
              details:
                fields:
                  password: must be at least 10 characters
    Unauthorized:
      description: Not signed in, or (login) invalid username or password.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Refused - cross-origin request, source address not allowed, wrong setup token, registration closed, or the caller's role or token may not do this to a resource it can see.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource, an invite / reset code that is not usable, or a channel, message or user the caller cannot see (existence is never revealed with 403).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: State conflict - setup already completed, username or channel name taken, archived channel (read-only), or deleted message.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: Request body larger than 1 MiB (JSON endpoints).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMedia:
      description: Content-Type is not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many requests. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InsufficientStorage:
      description: The data volume has less free space than the `disk_reserve_bytes` setting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FileContent:
      description: The file or its thumbnail.
      headers:
        Content-Disposition:
          description: "`inline; filename=...` for allowlisted types, else `attachment; filename=...` (RFC 6266, with `filename*` for non-ASCII names)."
          schema:
            type: string
        ETag:
          description: The SHA-256 of the content, quoted.
          schema:
            type: string
        Cache-Control:
          description: "`private, max-age=31536000, immutable`."
          schema:
            type: string
        Content-Security-Policy:
          description: "`sandbox; default-src 'none'; img-src 'self'; media-src 'self'`."
          schema:
            type: string
        Cross-Origin-Resource-Policy:
          description: "`same-origin`."
          schema:
            type: string
        X-Content-Type-Options:
          description: "`nosniff`."
          schema:
            type: string
      content:
        image/*:
          schema:
            type: string
            format: binary
        video/*:
          schema:
            type: string
            format: binary
        audio/*:
          schema:
            type: string
            format: binary
        application/octet-stream:
          schema:
            type: string
            format: binary
    Unavailable:
      description: The server is busy, shutting down or in maintenance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: Unexpected server error (and any other status not listed for the operation).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      description: The error envelope.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - too_large
            - unsupported_media
            - rate_limited
            - insufficient_storage
            - unavailable
            - internal
        message:
          type: string
          description: Human-readable text; never contains secrets.
        details:
          type: object
          description: Optional machine-readable context.
          properties:
            fields:
              type: object
              description: Validation failures, request field to reason.
              additionalProperties:
                type: string
          additionalProperties: true

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    SetupStatus:
      type: object
      required: [needs_setup]
      properties:
        needs_setup:
          type: boolean

    SetupRequest:
      type: object
      required: [setup_token, username, password, instance_name]
      properties:
        setup_token:
          type: string
          maxLength: 256
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/PasswordInput"
        display_name:
          type: string
          maxLength: 256
        instance_name:
          type: string
          maxLength: 256

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024

    AcceptInviteRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/PasswordInput"
        display_name:
          type: string
          maxLength: 256

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          $ref: "#/components/schemas/Username"
        password:
          $ref: "#/components/schemas/PasswordInput"
        display_name:
          type: string
          maxLength: 256

    ResetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          $ref: "#/components/schemas/PasswordInput"

    ChangePasswordRequest:
      type: object
      required: [current, new]
      properties:
        current:
          type: string
          maxLength: 1024
        new:
          $ref: "#/components/schemas/PasswordInput"

    Username:
      type: string
      maxLength: 256
      description: 2-32 characters of lowercase letters, digits, `.`, `_`, `-` (input is trimmed and lower-cased).

    PasswordInput:
      type: string
      maxLength: 1024
      description: |
        Policy: 10-128 characters and not one of the 10,000 most common passwords.
        Violations are `400` with `details.fields`.

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/Me"

    InviteInfo:
      type: object
      required: [valid, instance_name]
      properties:
        valid:
          type: boolean
        role:
          $ref: "#/components/schemas/Role"
        instance_name:
          type: string

    Role:
      type: string
      enum: [admin, member, guest]

    User:
      type: object
      required: [id, username, display_name, kind, role, avatar_file_id, status_text, deactivated, created_at]
      properties:
        id:
          type: string
          pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
        username:
          type: string
        display_name:
          type: string
        kind:
          type: string
          enum: [human, app]
        role:
          $ref: "#/components/schemas/Role"
        avatar_file_id:
          type: [string, "null"]
        status_text:
          type: string
        deactivated:
          type: boolean
        created_at:
          type: string
          format: date-time

    Me:
      description: The signed-in user's own view.
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [prefs, must_change_pw]
          properties:
            prefs:
              type: object
              additionalProperties: true
            must_change_pw:
              type: boolean

    Session:
      type: object
      required: [id, kind, current, created_at, last_seen_at, idle_expires_at, abs_expires_at, user_agent, ip]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{32}$"
        kind:
          type: string
          enum: [web, handoff]
        current:
          type: boolean
          description: True for the session that made this request.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        abs_expires_at:
          type: string
          format: date-time
        user_agent:
          type: string
        ip:
          type: string

    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"

    DeviceLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, device_name]
      properties:
        username:
          type: string
          maxLength: 256
        password:
          type: string
          maxLength: 1024
        device_name:
          type: string
          minLength: 1
          maxLength: 256
          description: Shown in the device list; at most 64 printable characters after trimming.

    DeviceLoginResponse:
      type: object
      required: [device_token, device_id, handoff_code]
      properties:
        device_token:
          type: string
          description: The device token (`bub_...`). Shown once; the SHA-256 is stored.
        device_id:
          type: string
        handoff_code:
          type: string
          description: One-time code for `GET /auth/handoff`, valid for 60 seconds.

    HandoffCodeResponse:
      type: object
      required: [handoff_code]
      properties:
        handoff_code:
          type: string

    Device:
      type: object
      required: [id, name, prefix, scopes, current, created_at, last_used_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [events:read, messages:read, notify]
        current:
          type: boolean
          description: True for the device whose token made this request.
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time

    DeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Device"

    Id:
      type: string
      description: A ULID. Ids sort in creation order.
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"

    Channel:
      type: object
      additionalProperties: false
      description: >-
        A channel or direct message. DMs and group DMs have no name; `participant_ids` lists
        their participants.
      required: [id, kind, name, topic, description, is_default, retention_days, created_by, created_at, archived_at, member_count]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          type: string
          enum: [public, private, dm, group_dm]
        name:
          type: [string, "null"]
        topic:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        retention_days:
          type: [integer, "null"]
          minimum: 1
        created_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at:
          type: string
          format: date-time
        archived_at:
          type: [string, "null"]
          format: date-time
        member_count:
          type: integer
          minimum: 0
        participant_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    Membership:
      type: object
      additionalProperties: false
      description: >-
        A user's membership of a channel, with their notification settings.
      required: [channel_id, user_id, role, joined_at, last_read_id, notify_level, alert_min_severity, muted_until]
      properties:
        channel_id:
          $ref: "#/components/schemas/Id"
        user_id:
          $ref: "#/components/schemas/Id"
        role:
          type: string
          enum: [owner, member]
        joined_at:
          type: string
          format: date-time
        last_read_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        notify_level:
          type: string
          enum: [all, mentions, none]
        alert_min_severity:
          type: string
          enum: [info, warning, critical]
        muted_until:
          type: [string, "null"]
          format: date-time

    Member:
      type: object
      additionalProperties: false
      description: >-
        One entry of a channel's member list.
      required: [user_id, role, joined_at]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        role:
          type: string
          enum: [owner, member]
        joined_at:
          type: string
          format: date-time

    Unread:
      type: object
      additionalProperties: false
      description: >-
        Unread counters of one channel.
      required: [channel_id, unread, mentions]
      properties:
        channel_id:
          $ref: "#/components/schemas/Id"
        unread:
          type: integer
          minimum: 0
        mentions:
          type: integer
          minimum: 0

    SettingsPublic:
      type: object
      additionalProperties: false
      description: >-
        The settings every signed-in client may know.
      required: [instance_name, upload_max_bytes, web_push_enabled]
      properties:
        instance_name:
          type: string
        upload_max_bytes:
          type: integer
          format: int64
          minimum: 0
        web_push_enabled:
          type: boolean

    Bootstrap:
      type: object
      additionalProperties: false
      description: >-
        The client snapshot. It is consistent with `seq_head`: replaying events after it
        converges to the current state. A new `instance_id` or a higher `epoch` than the client
        remembers means the server was reset.
      required: [instance_id, epoch, me, users, channels, memberships, unread, settings_public, seq_head]
      properties:
        instance_id:
          type: string
        epoch:
          type: integer
          format: int64
          minimum: 0
        me:
          $ref: "#/components/schemas/Me"
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Channel"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        unread:
          type: array
          items:
            $ref: "#/components/schemas/Unread"
        settings_public:
          $ref: "#/components/schemas/SettingsPublic"
        seq_head:
          type: integer
          format: int64
          minimum: 0

    Author:
      type: object
      additionalProperties: false
      description: >-
        Who wrote a message.
      required: [id, username, display_name, kind, avatar_url]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        display_name:
          type: string
        kind:
          type: string
          enum: [human, app]
        avatar_url:
          type: [string, "null"]

    File:
      type: object
      additionalProperties: false
      description: >-
        An uploaded file: the answer of `POST /files` and the element of a message's `files`.
        `category` is `image`, `video` or `audio` only for the types that are shown inline;
        everything else, including images that could not be processed, is `file`. `width` and
        `height` are set for processed images. `meta_stripped` is false when the file may still
        carry metadata (HEIC, video, audio, documents, unprocessed images).
      required: [id, name, size, mime, category, width, height, has_thumb, meta_stripped, url, thumb_url]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        mime:
          type: string
        category:
          type: string
          enum: [image, video, audio, file]
        width:
          type: [integer, "null"]
        height:
          type: [integer, "null"]
        has_thumb:
          type: boolean
        meta_stripped:
          type: boolean
        url:
          type: string
        thumb_url:
          type: [string, "null"]

    Reaction:
      type: object
      additionalProperties: false
      description: >-
        One emoji on a message and who used it.
      required: [emoji, count, user_ids]
      properties:
        emoji:
          type: string
        count:
          type: integer
          minimum: 1
        user_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    Mentions:
      type: object
      additionalProperties: false
      description: >-
        Who a message notifies.
      required: [user_ids, channel, here]
      properties:
        user_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        channel:
          type: boolean
        here:
          type: boolean

    AlertField:
      type: object
      additionalProperties: false
      description: >-
        A name/value pair of an alert.
      required: [name, value, short]
      properties:
        name:
          type: string
        value:
          type: string
        short:
          type: boolean

    Alert:
      type: object
      additionalProperties: false
      description: >-
        The alert state of an `alert` message.
      required: [severity, state, title, fields, link, dedupe_key, occurrences, first_seen_at, last_seen_at, acked_by, acked_at, resolved_by, resolved_at]
      properties:
        severity:
          type: string
          enum: [info, warning, critical]
        state:
          type: string
          enum: [open, acked, resolved]
        title:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AlertField"
        link:
          type: [string, "null"]
        dedupe_key:
          type: string
        occurrences:
          type: integer
          minimum: 1
        first_seen_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        acked_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        acked_at:
          type: [string, "null"]
          format: date-time
        resolved_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        resolved_at:
          type: [string, "null"]
          format: date-time

    Message:
      type: object
      additionalProperties: false
      description: >-
        A chat message. A deleted message stays as a tombstone (`deleted: true`, empty body).
      required: [id, channel_id, thread_root_id, kind, author, override_name, body, files, reactions, mentions, reply_count, last_reply_at, edited_at, deleted, created_at, alert]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        channel_id:
          $ref: "#/components/schemas/Id"
        thread_root_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        kind:
          type: string
          enum: [text, alert, system]
        author:
          $ref: "#/components/schemas/Author"
        override_name:
          type: [string, "null"]
        body:
          type: string
          description: Markdown.
        files:
          type: array
          items:
            $ref: "#/components/schemas/File"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"
        mentions:
          $ref: "#/components/schemas/Mentions"
        reply_count:
          type: integer
          minimum: 0
        last_reply_at:
          type: [string, "null"]
          format: date-time
        edited_at:
          type: [string, "null"]
          format: date-time
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        alert:
          oneOf:
            - $ref: "#/components/schemas/Alert"
            - type: "null"

    MessagePage:
      type: object
      additionalProperties: false
      description: >-
        A page of messages, oldest first. `has_more_before` / `has_more_after` say whether older
        / newer messages exist beyond the page.
      required: [items, has_more_before, has_more_after]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        has_more_before:
          type: boolean
        has_more_after:
          type: boolean

    Thread:
      type: object
      additionalProperties: false
      description: >-
        A thread: its root and a page of replies, oldest first.
      required: [root, replies, has_more_before, has_more_after]
      properties:
        root:
          $ref: "#/components/schemas/Message"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        has_more_before:
          type: boolean
        has_more_after:
          type: boolean

    Pin:
      type: object
      additionalProperties: false
      description: >-
        A pinned message.
      required: [message, pinned_by, pinned_at]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        pinned_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        pinned_at:
          type: string
          format: date-time

    SearchResult:
      type: object
      additionalProperties: false
      description: >-
        One search hit.
      required: [message, snippet]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        snippet:
          type: string
          description: >-
            HTML fragment safe to render as markup: message text is HTML-escaped and the only tags
            are `<mark>` and `</mark>` around matched terms.

    SearchPage:
      type: object
      additionalProperties: false
      description: >-
        A page of search results, best match first.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/SearchResult"
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor of the next page; null on the last page.

    ReadState:
      type: object
      additionalProperties: false
      description: >-
        A channel's read marker and counters after marking it read.
      required: [channel_id, last_read_id, unread, mentions]
      properties:
        channel_id:
          $ref: "#/components/schemas/Id"
        last_read_id:
          $ref: "#/components/schemas/Id"
        unread:
          type: integer
          minimum: 0
        mentions:
          type: integer
          minimum: 0

    UserList:
      type: object
      additionalProperties: false
      description: >-
        Users ordered by id.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    ChannelList:
      type: object
      additionalProperties: false
      description: >-
        Channels.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    MemberList:
      type: object
      additionalProperties: false
      description: >-
        Members, oldest first.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    PinList:
      type: object
      additionalProperties: false
      description: >-
        Pins, newest first.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pin"

    ReactionList:
      type: object
      additionalProperties: false
      description: >-
        A message's reactions.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"

    CreateChannelRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /channels`. Names are trimmed and lower-cased (a leading `#` is dropped); they
        may contain only letters, digits and hyphens, at most 64 characters, and are unique among
        channels.
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [public, private]
        topic:
          type: string
          maxLength: 250
        member_ids:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Id"

    UpdateMeRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `PATCH /me`; omitted fields stay as they are.
      properties:
        display_name:
          type: string
          maxLength: 256
          description: At most 64 characters after trimming; empty means the username. Not null.
        status_text:
          type: [string, "null"]
          maxLength: 1024
          description: At most 100 characters; null clears it.
        avatar_file_id:
          type: [string, "null"]
          maxLength: 64
          description: An image file uploaded by the caller; null removes the avatar.
        prefs:
          type: object
          additionalProperties: true
          description: The new preferences object (at most 4096 bytes of JSON); replaces the old one.

    UpdateChannelRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `PATCH /channels/{id}`; omitted fields stay as they are.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        topic:
          type: string
          maxLength: 250
        description:
          type: string
          maxLength: 1000
        retention_days:
          type: [integer, "null"]
          minimum: 1
          description: Days to keep messages; null removes the channel's own retention. Capped by the server-wide maximum.

    AddMemberRequest:
      type: object
      additionalProperties: false
      description: >-
        Optional body of `PUT /channels/{id}/members/{user_id}`.
      properties:
        role:
          type: string
          enum: [owner, member]
          default: member

    UpdateMembershipRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `PATCH /channels/{id}/membership`; omitted fields stay as they are.
      properties:
        notify_level:
          type: string
          enum: [all, mentions, none]
        alert_min_severity:
          type: string
          enum: [info, warning, critical]
        muted_until:
          type: [string, "null"]
          format: date-time
          description: Mute until this time; null unmutes.

    MarkReadRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /channels/{id}/read`.
      required: [message_id]
      properties:
        message_id:
          $ref: "#/components/schemas/Id"

    StartDMRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /dms`.
      required: [user_ids]
      properties:
        user_ids:
          type: array
          maxItems: 9
          items:
            $ref: "#/components/schemas/Id"
          description: The other participants; the caller is added.

    CreateMessageRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /channels/{id}/messages`.
      required: [body]
      properties:
        body:
          type: string
          maxLength: 8000
          description: Markdown. May be empty only when files are attached.
        thread_root_id:
          $ref: "#/components/schemas/Id"
        file_ids:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Id"
        nonce:
          type: string
          maxLength: 64
          description: Client-chosen idempotency key, unique per author. Posting the same nonce again returns the first message.

    EditMessageRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `PATCH /messages/{id}`.
      required: [body]
      properties:
        body:
          type: string
          maxLength: 8000

    PushKeys:
      type: object
      additionalProperties: false
      description: >-
        The keys of a browser `PushSubscription` (`toJSON().keys`), base64url
        without padding (RFC 8291).
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          maxLength: 128
          description: The client's uncompressed P-256 public key (65 bytes).
        auth:
          type: string
          maxLength: 64
          description: The client's 16-byte authentication secret.

    PushSubscribeRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /push/subscriptions`.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          maxLength: 2048
          description: The push service URL of the subscription (https, known push service host).
        keys:
          $ref: "#/components/schemas/PushKeys"

    PushUnsubscribeRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `DELETE /push/subscriptions`.
      required: [endpoint]
      properties:
        endpoint:
          type: string
          maxLength: 2048

    PushVapidKey:
      type: object
      additionalProperties: false
      description: >-
        The VAPID public key (base64url, uncompressed P-256 point).
      required: [key]
      properties:
        key:
          type: string

    Scope:
      type: string
      description: A scope an app token can carry.
      enum: [messages:read, messages:write, alerts:write, files:write, channels:read, events:read, commands, dm:write, mcp]

    AppToken:
      type: object
      additionalProperties: false
      description: >-
        An app token as listed: its secret is never shown again, only the 8-character
        `prefix` ("bub_" and four characters). `channel_ids` null means the channels the
        app's bot is a member of; a list restricts the token to those channels.
      required: [id, app_id, prefix, scopes, channel_ids, created_at, expires_at, last_used_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        app_id:
          $ref: "#/components/schemas/Id"
        prefix:
          type: string
          minLength: 8
          maxLength: 8
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        channel_ids:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Id"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.
        revoked_at:
          type: [string, "null"]
          format: date-time

    App:
      type: object
      additionalProperties: false
      description: >-
        An integration: a bot account (`user_id`, `username`) plus its tokens. `tokens`
        lists every token including revoked ones in the admin API, and is empty in
        `GET /apps/self`.
      required: [id, user_id, username, name, description, owner_user_id, created_at, disabled_at, tokens]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        user_id:
          $ref: "#/components/schemas/Id"
        username:
          type: string
        name:
          type: string
        description:
          type: string
        owner_user_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/AppToken"

    AppList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/App"

    AppSelf:
      type: object
      additionalProperties: false
      description: >-
        Body of `GET /apps/self`.
      required: [app, token]
      properties:
        app:
          $ref: "#/components/schemas/App"
        token:
          $ref: "#/components/schemas/AppToken"

    Command:
      type: object
      additionalProperties: false
      required: [name, description, usage, app_name, builtin]
      properties:
        name:
          type: string
        description:
          type: string
        usage:
          type: string
        app_name:
          type: string
          description: Empty for a built-in.
        builtin:
          type: boolean

    CommandList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Command"

    CommandInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9-]{1,32}$"
        description:
          type: string
          maxLength: 200
        usage:
          type: string
          maxLength: 200

    InvokeCommandRequest:
      type: object
      additionalProperties: false
      required: [channel_id, command]
      properties:
        channel_id:
          $ref: "#/components/schemas/Id"
        command:
          type: string
        args:
          type: string
          maxLength: 4000
        thread_root_id:
          $ref: "#/components/schemas/Id"

    InvokedCommand:
      type: object
      additionalProperties: false
      required: [builtin]
      properties:
        invocation_id:
          type: string
          description: Set for an app command.
        builtin:
          type: boolean

    RespondCommandRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          maxLength: 4000
        ephemeral:
          type: boolean

    RespondedCommand:
      type: object
      additionalProperties: false
      required: [ephemeral, message]
      properties:
        ephemeral:
          type: boolean
        message:
          oneOf:
            - $ref: "#/components/schemas/Message"
            - type: "null"

    CreateAppRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /admin/apps`. Without `username` the bot's username is derived from
        `name` (made unique with a numeric suffix).
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 500
        username:
          type: string
          pattern: "^[A-Za-z0-9._-]{2,32}$"

    UpdateAppRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `PATCH /admin/apps/{id}`. Absent fields are left alone.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 500
        disabled:
          type: boolean

    CreateAppTokenRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /admin/apps/{id}/tokens`. `channel_ids` absent or null leaves the token
        without an allowlist; a list (even an empty one) restricts it to those channels, which
        must exist. `expires_at` must lie in the future.
      required: [scopes]
      properties:
        scopes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Scope"
        channel_ids:
          type: [array, "null"]
          items:
            $ref: "#/components/schemas/Id"
        expires_at:
          type: [string, "null"]
          format: date-time

    IssuedAppToken:
      type: object
      additionalProperties: false
      description: >-
        A new app token. `token` and `connection_string` are shown only in this answer.
      required: [token, connection_string, info]
      properties:
        token:
          type: string
          pattern: "^bub_[a-z2-7]{52}$"
        connection_string:
          type: string
          description: "`bubbles://<host>:<https port>/?token=bub_...&fp=sha256:<64 hex CA fingerprint>`."
        info:
          $ref: "#/components/schemas/AppToken"

    AlertInput:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /alerts`. `renotify_after_s` is 0 (never) or 10-86400 and defaults to
        the `alert_renotify_s` setting. `occurred_at` is when the condition was seen (never
        recorded as later than the server's clock). `link` must be an http or https URL.
      required: [channel, severity, title, dedupe_key]
      properties:
        channel:
          type: string
          minLength: 1
          maxLength: 80
          description: A channel name (a leading `#` is ignored) or id.
        severity:
          type: string
          enum: [info, warning, critical]
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          maxLength: 4000
          description: Markdown.
        fields:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AlertInputField"
        link:
          type: string
          maxLength: 2048
        dedupe_key:
          type: string
          minLength: 1
          maxLength: 200
        renotify_after_s:
          type: integer
          minimum: 0
          maximum: 86400
        occurred_at:
          type: string
          format: date-time

    AlertInputField:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        value:
          type: string
          maxLength: 512
        short:
          type: boolean

    PostedAlert:
      type: object
      additionalProperties: false
      description: >-
        Answer of `POST /alerts`: the alert's message and what the post did to the alert.
      required: [message, transition]
      properties:
        message:
          $ref: "#/components/schemas/Message"
        transition:
          type: string
          enum: [created, escalated, renotify_due, updated_other]

    ResolveAlertByKeyRequest:
      type: object
      additionalProperties: false
      required: [dedupe_key]
      properties:
        dedupe_key:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          maxLength: 4000

    ResolveAlertRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 4000

    AlertPage:
      type: object
      additionalProperties: false
      description: >-
        A page of alert messages, newest first. `next_cursor` is null on the last page.
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        next_cursor:
          type: [string, "null"]

    PairingRequestInput:
      type: object
      additionalProperties: false
      required: [app_name]
      properties:
        app_name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 500
        requested_scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"

    PairingCreated:
      type: object
      additionalProperties: false
      description: >-
        An open pairing request. Show `code` to the admin; poll with `poll_secret` (shown
        only here).
      required: [id, poll_secret, code, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        poll_secret:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        expires_at:
          type: string
          format: date-time

    PairingStatus:
      type: object
      additionalProperties: false
      description: >-
        State of a pairing request. `token` is present in exactly one answer: the first
        poll after the approval, which also moves the state to `claimed`.
      required: [state, expires_at]
      properties:
        state:
          type: string
          enum: [pending, approved, denied, expired, claimed]
        token:
          type: string
        expires_at:
          type: string
          format: date-time

    PendingPairing:
      type: object
      additionalProperties: false
      description: >-
        An open pairing request as the admin sees it. `ca_fingerprint` is the SHA-256
        fingerprint of the server's CA, to compare with the one the app displays.
      required: [id, app_name, description, requested_scopes, code, source_ip, ca_fingerprint, created_at, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        app_name:
          type: string
        description:
          type: string
        requested_scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        code:
          type: string
          pattern: "^[0-9]{6}$"
        source_ip:
          type: string
        ca_fingerprint:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    PendingPairingList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingPairing"

    ApprovePairingRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /admin/pairing-requests/{id}/approve`. Without `scopes` the requested
        scopes are granted.
      properties:
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/Scope"
        channel_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        create_channel:
          type: boolean

    PairingApproval:
      type: object
      additionalProperties: false
      description: >-
        The app created by an approval and the ids of the channels its bot was added to
        (the created `<app>-alerts` channel first).
      required: [app, channel_ids]
      properties:
        app:
          $ref: "#/components/schemas/App"
        channel_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"

    Webhook:
      type: object
      additionalProperties: false
      description: >-
        An incoming webhook. The secret URL is not part of it; only `CreatedWebhook` carries it,
        once.
      required: [id, channel_id, app_id, name, created_by, created_at, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        channel_id:
          $ref: "#/components/schemas/Id"
        app_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        created_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    WebhookList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"

    CreateWebhookRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /admin/webhooks`. `name` becomes the name of the pseudo-app and of its
        bot account; `channel_id` is a public or private channel that is not archived.
      required: [channel_id, name]
      properties:
        channel_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          minLength: 1
          maxLength: 64

    CreatedWebhook:
      type: object
      additionalProperties: false
      description: A new webhook. `url` carries the secret and is shown only in this answer.
      required: [id, channel_id, app_id, name, created_by, created_at, revoked_at, url]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        channel_id:
          $ref: "#/components/schemas/Id"
        app_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        created_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        url:
          type: string
          description: "`https://<first LAN host>:<https port>/hooks/bwh_...`."

    ResetPreview:
      type: object
      additionalProperties: false
      description: What a reset would delete (`GET /admin/reset/preview`).
      required: [users, channels, messages, files, bytes]
      properties:
        users:
          type: integer
          minimum: 0
        channels:
          type: integer
          minimum: 0
        messages:
          type: integer
          minimum: 0
        files:
          type: integer
          minimum: 0
        bytes:
          type: integer
          format: int64
          minimum: 0

    ResetRequest:
      type: object
      additionalProperties: false
      description: >-
        Body of `POST /admin/reset`. `rotate_ca` and `keep_settings` apply to `factory` only
        (`400` with `content`).
      required: [mode, confirm, password]
      properties:
        mode:
          type: string
          enum: [content, factory]
        confirm:
          type: string
          minLength: 1
          description: The instance name, typed to confirm.
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: The admin's own password.
        rotate_ca:
          type: boolean
          default: false
          description: Destroy the CA key and issue a new CA; every device must trust it again.
        keep_settings:
          type: boolean
          default: false
          description: Carry the server settings over.

    ContentCleared:
      type: object
      additionalProperties: false
      description: Answer of a `content` reset. Sessions stay valid; clients resync.
      required: [epoch]
      properties:
        epoch:
          type: integer
          format: int64
          minimum: 2

    FactoryReset:
      type: object
      additionalProperties: false
      description: >-
        Answer of a `factory` reset: the one-time setup token (valid until setup completes), the
        URL of the setup wizard and the fingerprint (SHA-256) devices must trust.
      required: [setup_token, setup_url, ca_rotated, ca_fingerprint]
      properties:
        setup_token:
          type: string
          minLength: 1
        setup_url:
          type: string
        ca_rotated:
          type: boolean
        ca_fingerprint:
          type: string

    AdminOverview:
      type: object
      additionalProperties: false
      description: Body of `GET /admin/overview`.
      required: [instance_name, version, started_at, uptime_seconds, users, connections, storage_used_bytes, disk_free_bytes, tls_mode, ca_fingerprint, cert_not_after, https_urls, onboarding_urls, client_isolation_hint]
      properties:
        instance_name: {type: string}
        version: {type: string}
        started_at: {type: string}
        uptime_seconds: {type: integer, format: int64, minimum: 0}
        users: {type: integer, minimum: 0}
        connections: {type: integer, minimum: 0}
        storage_used_bytes: {type: integer, format: int64, minimum: 0}
        disk_free_bytes: {type: [integer, "null"], format: int64, minimum: 0}
        tls_mode: {type: string}
        ca_fingerprint: {type: string}
        cert_not_after: {type: string}
        https_urls: {type: array, items: {type: string}}
        onboarding_urls: {type: array, items: {type: string}}
        client_isolation_hint: {type: boolean}

    AdminSettings:
      type: object
      additionalProperties: false
      description: Every setting with defaults applied.
      required: [instance_name, open_registration, upload_max_bytes, user_quota_bytes, disk_reserve_bytes, default_retention_days, web_push_enabled, push_payload, allowed_cidrs, session_idle_days, alert_renotify_s, mdns_enabled, web_reset_enabled]
      properties:
        instance_name: {type: string, minLength: 1, maxLength: 64}
        open_registration: {type: boolean}
        upload_max_bytes: {type: integer, format: int64, minimum: 1, maximum: 2147483648}
        user_quota_bytes: {type: integer, format: int64, minimum: 0}
        disk_reserve_bytes: {type: integer, format: int64, minimum: 0}
        default_retention_days: {type: [integer, "null"], minimum: 1, maximum: 3650}
        web_push_enabled: {type: boolean}
        push_payload: {type: string, enum: [minimal, full]}
        allowed_cidrs: {type: array, items: {type: string}}
        session_idle_days: {type: integer, minimum: 1, maximum: 90}
        alert_renotify_s: {type: integer, minimum: 10, maximum: 86400}
        mdns_enabled: {type: boolean}
        web_reset_enabled: {type: boolean}

    AdminSettingsPatch:
      type: object
      additionalProperties: false
      description: "Body of `PATCH /admin/settings`: any subset of the settings; at least one key."
      minProperties: 1
      properties:
        instance_name: {type: string}
        open_registration: {type: boolean}
        upload_max_bytes: {type: integer, format: int64}
        user_quota_bytes: {type: integer, format: int64}
        disk_reserve_bytes: {type: integer, format: int64}
        default_retention_days: {type: [integer, "null"]}
        web_push_enabled: {type: boolean}
        push_payload: {type: string}
        allowed_cidrs: {type: array, items: {type: string}}
        session_idle_days: {type: integer}
        alert_renotify_s: {type: integer}
        mdns_enabled: {type: boolean}
        web_reset_enabled: {type: boolean}

    AdminUserList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"

    UpdateAdminUserRequest:
      type: object
      additionalProperties: false
      description: "Body of `PATCH /admin/users/{id}`; at least one field."
      properties:
        role:
          $ref: "#/components/schemas/Role"
        deactivated:
          type: boolean

    PasswordResetLink:
      type: object
      additionalProperties: false
      description: The one-time link; it is in this answer only.
      required: [url, expires_at]
      properties:
        url: {type: string}
        expires_at: {type: string, format: date-time}

    AdminInvite:
      type: object
      additionalProperties: false
      description: An invite without its code.
      required: [id, role, note, created_by, created_at, expires_at, max_uses, use_count, revoked_at]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        role:
          $ref: "#/components/schemas/Role"
        note: {type: string}
        created_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer, minimum: 1}
        use_count: {type: integer, minimum: 0}
        revoked_at: {type: [string, "null"], format: date-time}

    AdminInviteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminInvite"

    CreateInviteRequest:
      type: object
      additionalProperties: false
      description: Body of `POST /admin/invites`. Absent fields take the defaults.
      properties:
        role:
          $ref: "#/components/schemas/Role"
        note: {type: string, maxLength: 200}
        expires_in_seconds: {type: integer, minimum: 60, maximum: 7776000}
        max_uses: {type: integer, minimum: 1, maximum: 1000}

    CreatedInvite:
      type: object
      additionalProperties: false
      description: The invite and its link; the link (secret code) is in this answer only.
      required: [id, role, note, created_by, created_at, expires_at, max_uses, use_count, revoked_at, url]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        role:
          $ref: "#/components/schemas/Role"
        note: {type: string}
        created_by:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        max_uses: {type: integer, minimum: 1}
        use_count: {type: integer, minimum: 0}
        revoked_at: {type: [string, "null"], format: date-time}
        url: {type: string}

    AdminChannelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Channel"

    UpdateAdminChannelRequest:
      type: object
      additionalProperties: false
      description: "Body of `PATCH /admin/channels/{id}`. Absent fields stay; `retention_days` null means forever."
      properties:
        retention_days: {type: [integer, "null"], minimum: 1, maximum: 3650}
        is_default: {type: boolean}
        archived: {type: boolean}

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, at, actor_id, actor_kind, actor_ip, action, target_type, target_id, detail]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        at: {type: string, format: date-time}
        actor_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        actor_kind: {type: string}
        actor_ip: {type: string}
        action: {type: string}
        target_type: {type: string}
        target_id: {type: string}
        detail: {type: object}

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor: {type: [string, "null"]}

    AdminTLS:
      type: object
      additionalProperties: false
      required: [mode, ca_fingerprint, leaf_fingerprint, leaf_not_after, sans]
      properties:
        mode: {type: string, enum: [local-ca, byo]}
        ca_fingerprint: {type: string}
        leaf_fingerprint: {type: string}
        leaf_not_after: {type: string, format: date-time}
        sans: {type: array, items: {type: string}}

    BackupRequest:
      type: object
      additionalProperties: false
      description: Body of `POST /admin/backup`.
      required: [passphrase]
      properties:
        passphrase:
          type: string
          minLength: 1

    WebhookPayload:
      type: object
      description: >-
        Body of `POST /hooks/{token}`: the native payload or the Slack subset (see the
        operation). Unknown keys are ignored, so unmodified Slack payloads are accepted.
      properties:
        text:
          type: string
        username:
          type: string
        icon_emoji:
          type: string
        attachments:
          type: array
          items:
            type: object
        blocks:
          type: array
          items:
            type: object
        alert:
          type: [object, "null"]
          description: Native alert; see the operation. null is the same as absent.
          properties:
            severity:
              type: string
              enum: [info, warning, critical]
            title:
              type: string
            text:
              type: string
            fields:
              type: array
              items:
                type: object
            link:
              type: string
            dedupe_key:
              type: string
            renotify_after_s:
              type: integer
