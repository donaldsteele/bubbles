      responses:
        "200":
          description: The nonce matched an earlier post; its message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "201":
          description: The message was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
