openapi: 3.1.0
info:
  title: bubbles REST API
  version: 1.0.0
  summary: Self-hosted LAN chat server.
  description: |
    REST contract of the bubbles server. Everything is served over HTTPS
    (default port 28225); JSON in, JSON out.

    **Authentication.** A browser session travels in the `__Host-bubbles_session`
    cookie (Secure, HttpOnly, SameSite=Strict, Path=/). Only the SHA-256 of the
    token is stored server-side. An app authenticates with `Authorization: Bearer
    bub_...` (`bearerAuth`): a token is shown once when it is issued, only its SHA-256 is
    stored, and it carries scopes (`messages:read`, `messages:write`, `alerts:write`,
    `files:write`, `channels:read`, `events:read`, `commands`, `dm:write`, `mcp`) and an
    optional channel allowlist. A revoked, expired or unknown token is a generic `401`; a
    token without the scope an endpoint needs is `403`. Bearer tokens work on the endpoints
    that list `bearerAuth`; everywhere else (setup, auth, invites, register, password resets,
    `/me`, push, `/admin`) a valid token is answered `403`.

    **CSRF.** Every state-changing request (anything but GET, HEAD, OPTIONS) that
    carries a session cookie must also carry an `Origin` (or `Referer`) header that
    names the request host, else the server answers `403 forbidden`.

    **Network gate.** Requests from non-private source addresses that are not in the
    `allowed_cidrs` setting are answered `403 forbidden` before any routing.

    **Errors.** Every non-2xx answer from the API is the `Error` envelope.
    Validation failures carry `details.fields`, a map of request field to reason.
    `429 rate_limited` carries `Retry-After` (seconds). Request bodies are limited
    to 1 MiB (`413 too_large`) and must be `application/json` (`415 unsupported_media`).

    **Time.** Timestamps are RFC 3339 UTC with milliseconds.

    **Visibility.** A channel the caller cannot see (a private channel or DM they are
    not in, or any channel for a guest who was not added) is answered `404 not_found`
    on every endpoint, never `403`, so its existence is not revealed. `403 forbidden`
    means the resource is visible but the action is not allowed.

    **Pagination.** Message lists take `before`, `after` or `around` (one message id, at
    most one of them) and `limit` (1-100, default 50), and answer
    `{items, has_more_before, has_more_after}` with the items oldest first. Invalid
    combinations are `400` with `details.fields`.

    **Rate limits.** Every session: 20 requests per second (burst 50). Message posts:
    additionally 10 per second per user (burst 20). Every app token: 10 requests per second
    (burst 30). Alerts: 60 per minute per app (burst 20). Webhooks: 30 per minute per webhook (burst 10). Pairing requests: 5 per minute per
    source address. Uploads: at most 5 in flight per user. Over the limit: `429 rate_limited`.

    **Files.** `POST /files` takes one file as `multipart/form-data` (field `file`), up to
    the `upload_max_bytes` setting (`413 too_large`; the per-user quota is a `413` too);
    it answers `507 insufficient_storage` when the disk is nearly full. JPEG, PNG and WebP
    uploads are stripped of EXIF, XMP, IPTC and text metadata. Files are served by
    `GET /files/{id}/{name}` to their uploader and to everyone who may see a channel with a
    message that attaches them (anyone signed in for avatars); other callers get `404`.
servers:
  - url: /api/v1
    description: REST API
  - url: /
    description: Unversioned operational endpoints (`/healthz`)
tags:
  - name: ops
    description: Liveness.
  - name: setup
    description: First-run setup.
  - name: auth
    description: Sign in and out.
  - name: invites
    description: Joining by invite link.
  - name: account
    description: The signed-in user's own account.
  - name: bootstrap
    description: Client snapshot.
  - name: users
    description: Looking up users.
  - name: channels
    description: Channels, membership and read state.
  - name: dms
    description: Direct messages and group DMs.
  - name: messages
    description: Messages and threads.
  - name: reactions
    description: Emoji reactions.
  - name: pins
    description: Pinned messages.
  - name: search
    description: Full-text message search.
  - name: files
    description: Uploads and file downloads.
  - name: push
    description: Web Push subscriptions (only while the admin enables web push).
  - name: apps
    description: App tokens and the calling app.
  - name: mcp
    description: Model Context Protocol endpoint for AI agents.
  - name: alerts
    description: Alerts posted by apps, acknowledged and resolved by members.
  - name: pairing
    description: Pairing an app with the server.
  - name: webhooks
    description: Incoming webhooks (native and Slack-compatible).
  - name: admin
    description: Administration of apps, tokens, pairing requests and webhooks (admin role, browser session).
security: []
paths:
  /healthz:
    get:
      tags: [ops]
      operationId: getHealth
      summary: Liveness probe
      description: No authentication. Subject to the network gate only. Served at the server root, not under `/api/v1`.
      servers:
        - url: /
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Internal"

  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: Whether first-run setup is still pending
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /setup:
    post:
      tags: [setup]
      operationId: completeSetup
      summary: Create the first admin account
      description: |
        Needs the one-time setup token printed on the server console (also in
        `setup-token.txt` in the data directory). Works exactly once: it creates the
        admin, sets the instance name, signs the admin in and deletes the token.
        Afterwards it answers `409 conflict`. A missing or wrong token is
        `403 forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username and password
      description: |
        Every failure is the same `401 unauthorized` (no user enumeration). After 5
        failures per username or 20 per IP address within 15 minutes the answer is
        `429 rate_limited` with `Retry-After`. A presented session cookie is revoked
        and replaced (session rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      description: Revokes the presented session and clears the cookie. Idempotent; works without a session.
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /auth/device-login:
    post:
      tags: [auth]
      operationId: deviceLogin
      summary: Sign a tray device in
      description: |
        Checks the credentials exactly like `POST /auth/login` (same lockout: 5 failures per
        username or 20 per IP address within 15 minutes, then `429`) and registers a device.
        The device token carries only the scopes `events:read`, `messages:read` and
        `notify`: it may open the WebSocket, read the bootstrap snapshot, messages and
        threads, and request handoff codes; everything else is `403`. Device tokens are
        revoked when the password changes or the account is deactivated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginRequest"
      responses:
        "200":
          description: The device was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /auth/handoff-code:
    post:
      tags: [auth]
      operationId: createHandoffCode
      summary: A new handoff code for the calling device
      security:
        - deviceAuth: []
      responses:
        "200":
          description: A one-time code, valid for 60 seconds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandoffCodeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /auth/handoff:
    get:
      tags: [auth]
      operationId: redeemHandoff
      summary: Open the web app from the tray without a second sign-in
      description: >-
        Served at the server root, not under `/api/v1`. Redeems a one-time handoff code
        (single use, 60 seconds), starts a normal web session (cookie, rotating any presented
        session) and redirects to `/`, or to the optional same-origin path `next` (a plain
        absolute path such as `/c/<channel id>`; anything else, including `//host`, backslashes,
        control characters or a scheme, is ignored and the redirect is `/`). An unknown, used or
        expired code redirects to `/login?error=handoff` without a cookie.
      servers:
        - url: /
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: next
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Redirect to `/` or `next` (cookie set) or to `/login?error=handoff`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        default:
          $ref: "#/components/responses/Internal"

  /invites/{code}:
    get:
      tags: [invites]
      operationId: getInvite
      summary: Look up an invite code
      description: Always `200`; `valid` is false for unknown, expired, revoked and used-up codes.
      parameters:
        - $ref: "#/components/parameters/Code"
      responses:
        "200":
          description: Invite state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /invites/{code}/accept:
    post:
      tags: [invites]
      operationId: acceptInvite
      summary: Create an account from an invite
      description: Consumes one use of the invite, creates the account with the invite's role and signs it in.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /register:
    post:
      tags: [invites]
      operationId: register
      summary: Self-register a member account
      description: Only when the `open_registration` setting is on; otherwise `403 forbidden`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/SessionStarted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /password-resets/{code}:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a one-time reset link
      description: |
        The code comes from an admin (`bubbles admin reset-password`, or the admin UI)
        and is valid for 24 hours, once. All of the user's sessions are revoked; the
        user signs in again with the new password.
      parameters:
        - $ref: "#/components/parameters/Code"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"
    patch:
      tags: [account]
      operationId: updateMe
      summary: Update the caller's profile
      description: |
        Partial update; omitted fields stay as they are. `display_name` (at most 64
        characters; empty means the username) and `prefs` cannot be null. `status_text`
        (at most 100 characters) null clears the text. `avatar_file_id` must be an image the
        caller uploaded with `POST /files` (anything else is `400` with
        `details.fields.avatar_file_id`); null removes the avatar. `prefs` replaces the whole
        object (a JSON object of at most 4096 bytes). A `user.updated` event is emitted when
        something changed.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The caller after the update.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /me/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Change the caller's password
      description: |
        Needs the current password (wrong: `400` with `details.fields.current`; repeated
        failures are rate limited). Every other session of the user is revoked.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed; other sessions revoked.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /me/sessions:
    get:
      tags: [account]
      operationId: listMySessions
      summary: The caller's live sessions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Sessions, most recently used first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /me/sessions/{id}:
    delete:
      tags: [account]
      operationId: revokeMySession
      summary: Revoke one of the caller's sessions
      description: Revoking the current session also clears the cookie.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session id from `GET /me/sessions`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "204":
          description: Session revoked.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /me/devices:
    get:
      tags: [account]
      operationId: listMyDevices
      summary: The caller tray devices
      description: Active device tokens, newest first. Browser sessions only.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Devices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /me/devices/{id}:
    delete:
      tags: [account]
      operationId: revokeMyDevice
      summary: Revoke a tray device
      description: >-
        Revokes the device token and closes its WebSocket connections. A browser session may
        revoke any device of its user; a device token only itself (the tray sign-out).
        Revoking an already revoked device succeeds.
      security:
        - cookieAuth: []
        - deviceAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Device id from `GET /me/devices`.
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "204":
          description: Device revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /bootstrap:
    get:
      tags: [bootstrap]
      operationId: getBootstrap
      summary: Snapshot to start (or resync) a client
      description: >-
        Everything a client needs at start: the caller, the users it may see, its channels
        (joined plus the visible public ones), its memberships and unread counts, the public
        settings, the instance identity (`instance_id`, `epoch`) and `seq_head`, the event
        sequence the snapshot is consistent with. Guests and apps see only the users they share
        a channel with and no public directory.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List or search users
      description: >-
        Visibility-filtered: members and admins see everyone; guests and apps see only
        themselves and users they share a channel with. `q` keeps users whose username or
        display name contains it (case-insensitive).
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search text, at most 64 characters.
          schema:
            type: string
            maxLength: 64
      responses:
        "200":
          description: Users ordered by id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: One user
      description: >-
        A user the caller may not see is `404`, exactly like one that does not exist.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /channels:
    get:
      tags: [channels]
      operationId: listChannels
      summary: Channels the caller is in, or the public directory
      description: >-
