        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /search:
    get:
      tags: [search]
      operationId: searchMessages
      summary: Search messages
      description: |
        Full-text search over the messages of the channels the caller is a member of (and may
        view). Private channels, DMs and public channels the caller has not joined or has left are
        never searched; deleted and system messages never match. Replies are included
        (`message.thread_root_id` is set).

        Query grammar (operators are case-insensitive; a token with an unknown operator name, or
        an operator with an empty value, is an ordinary word):

        `words "exact phrase" in:#channel from:@user has:file|image|link before:YYYY-MM-DD after:YYYY-MM-DD`

        - Words and phrases must all match. The last bare word also matches as a prefix.
          Letters match without regard to case or diacritics (`cafe` finds `café`). Punctuation
          and FTS syntax in the text are literal and never an error.
        - `in:#channel` restricts to the named channel among the caller's channels; `from:@user`
          to messages by that username. A name that matches nothing yields an empty result, not an
          error. A repeated `in:` or `from:` matches any of its values.
        - `has:file` is any attachment, `has:image` an image attachment, `has:link` a body
          containing `http://` or `https://`. Repeated `has:` operators must all hold.
        - `before:D` keeps messages created before 00:00 of day D and `after:D` those created at
          or after it, in the server's local time zone. An invalid date is a 400 on `q`.
        - A query may consist of filters only; it is then ordered newest first.

        Results are ordered by relevance (best first), then newest first. Pages hold at most 50
        results; pass `next_cursor` as `cursor` (with the same `q`) for the next page.

        `snippet` is an HTML fragment that is safe to render as markup: all message text in it
        is HTML-escaped (`&`, `<`, `>`, `"`, `'`) and the only tags are `<mark>` and `</mark>`
        around matched terms. It is a short excerpt around the first matches, or the start of the
        text for a filter-only query.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search query, 1 to 256 characters (see the grammar above).
          schema:
            type: string
            minLength: 1
            maxLength: 256
        - name: cursor
          in: query
          description: Opaque `next_cursor` of the previous page, used with the same `q`.
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: A page of results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /files:
    post:
      tags: [files]
      operationId: uploadFile
      summary: Upload a file
      description: |
        One file per request in the multipart field `file`, streamed to disk. The content
        is sniffed and cross-checked with the file name's extension; JPEG, PNG and WebP
        files lose their metadata (a JPEG with an EXIF orientation is rotated upright) and
        get a 640 px thumbnail when larger. Everything else is stored as it is and always
        served as a download (`meta_stripped` is false for HEIC, video, audio and
        documents). Identical content is stored once. Attach the returned id to a message
        with `file_ids` within 24 hours, or it is deleted.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: true
              properties:
                file:
                  type: string
                  format: binary
                  description: The file. Its file name is kept (sanitized) as `name`.
      responses:
        "201":
          description: The stored file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: |
            The file is larger than `upload_max_bytes` (`details.limit` is
            `upload_max_bytes`) or exceeds the caller's `user_quota_bytes`
            (`details.limit` is `user_quota_bytes`; `details.used_bytes` is what they store).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Content-Type is not multipart/form-data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        "507":
          $ref: "#/components/responses/InsufficientStorage"
        default:
          $ref: "#/components/responses/Internal"

  /files/{id}/{name}:
    get:
      tags: [files]
      operationId: getFile
      summary: Download or display a file
      description: |
        The file is found by `id`; `name` is cosmetic (the real name comes from the
        `Content-Disposition` header). Allowed for the uploader, for members of a channel
        with a live message that attaches the file (visibility as for the channel) and, for
        avatars, for every signed-in user; anything else is `404`.

        Only JPEG, PNG, GIF and WebP images, MP4 and WebM video and MP3, Ogg, WAV and WebM
        audio are sent with their own `Content-Type` and `Content-Disposition: inline`.
        Everything else (SVG, HTML, PDF, HEIC, ...) is `application/octet-stream` with
        `Content-Disposition: attachment`, as is any file with `download=1`. Responses carry
        `X-Content-Type-Options: nosniff`, a sandboxing `Content-Security-Policy`,
        `Cross-Origin-Resource-Policy: same-origin`, an immutable private `Cache-Control` and
        the SHA-256 of the content as `ETag`. `Range` requests are answered with `206`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: File id.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: name
          in: path
          required: true
          description: File name, URL-escaped. Ignored by the server.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: thumb
          in: query
          required: false
          description: "`1` returns the thumbnail (`404` when the file has none)."
          schema:
            type: string
            enum: ["0", "1"]
        - name: download
          in: query
          required: false
          description: "`1` forces `Content-Disposition: attachment`."
          schema:
            type: string
            enum: ["0", "1"]
        - name: Range
          in: header
          required: false
          description: Byte range, for example `bytes=0-1023`.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/FileContent"
        "206":
          $ref: "#/components/responses/FileContent"
        "304":
          description: Not modified (`If-None-Match` matched the `ETag`).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "416":
          description: The requested range cannot be satisfied.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /push/vapid-public-key:
    get:
      tags: [push]
      operationId: getPushVapidPublicKey
      summary: The VAPID public key for Web Push subscriptions
      description: >-
        Pass `key` as `applicationServerKey` to `PushManager.subscribe()`. Answers
        `404 not_found` while the admin setting `web_push_enabled` is off.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The server's VAPID public key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushVapidKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /push/subscriptions:
    post:
      tags: [push]
      operationId: subscribePush
      summary: Register or refresh a Web Push subscription of the caller
      description: >-
        Upserts by `endpoint`. The endpoint must be an `https` URL (port 443, no
        credentials) on a known browser push service (`fcm.googleapis.com`,
        `*.push.services.mozilla.com`, `*.notify.windows.com`, `*.push.apple.com`);
        anything else is `400` with `details.fields.endpoint`, because the server posts
        to this URL. A user may hold at most 10 subscriptions (`409 conflict`). An endpoint
        already registered to another account is taken over only by a request carrying the
        same `p256dh` and `auth` keys (the same browser signing in as someone else); any
        other request is `409 conflict`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
      responses:
        "204":
          description: The subscription is stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"
    delete:
      tags: [push]
      operationId: unsubscribePush
      summary: Remove one of the caller's Web Push subscriptions
      description: >-
        Idempotent: an unknown endpoint, or one that belongs to another user, is
        answered `204` too and nothing is removed.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
      responses:
        "204":
          description: The caller has no subscription with that endpoint.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /apps/self:
    get:
      tags: [apps]
      operationId: getAppSelf
      summary: The app and token behind the bearer token
      description: >-
        Only for an app token (`bearerAuth`); a browser session gets `403`. The `tokens`
        list of the returned app is empty.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The calling token's app and the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSelf"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /apps/self/commands:
    put:
      tags: [apps]
      operationId: setAppCommands
      summary: Replace the app's slash commands
      description: >-
        Needs an app token with `commands`. The body is the app's complete command set; it
        replaces the previous set atomically. Names match `^[a-z0-9-]{1,32}$`, are unique
        across all apps and must not be a built-in (`topic`, `invite`, `leave`, `mute`, `me`,
        `help`); a clash is `409` naming the owner. At most 50 commands.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 50
              items:
                $ref: "#/components/schemas/CommandInput"
      responses:
        "200":
          description: The stored commands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /commands:
    get:
      tags: [apps]
      operationId: listCommands
      summary: List the built-in and registered slash commands
      description: >-
        For autocomplete. A browser session, or an app token with `messages:read`.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Built-ins first, then app commands by name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /commands/invoke:
    post:
      tags: [apps]
      operationId: invokeCommand
      summary: Run a slash command
      description: >-
        Browser session only; the caller must be able to post in the channel. A built-in runs
        on the server (`200`; a problem becomes an ephemeral notice, not an error). An app
        command is sent as `command.invoked` to the app's connections (`202`). When the app
        has no live connection the answer is `503` and the caller gets an ephemeral
        "APP is offline" notice. `404` for an unknown command or channel; `409` when the
        app's bot is not in the channel.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeCommandRequest"
      responses:
        "200":
          description: A built-in command ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokedCommand"
        "202":
          description: The app was told.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokedCommand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          description: >-
            `rate_limited` with `Retry-After`. Either the shared message-post limit (per user,
            10 per second with a burst of 20, the same bucket as REST message posts), or a
            pending-invocation cap: at most 100 unanswered invocations per app and 20 per
            invoker across all apps. A cap clears when the app answers or the invocation
            expires.
          headers:
            Retry-After:
              $ref: "#/components/headers/RetryAfter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /commands/invocations/{id}/respond:
    post:
      tags: [apps]
      operationId: respondCommand
      summary: Answer a command invocation
      description: >-
        Only the app that owns the invocation (`commands` scope), within 15 minutes; an
        unknown, expired or foreign invocation is `404`. `ephemeral: true` shows the text
        only to the invoker and stores nothing; otherwise the app's bot posts a normal
        message in the channel or thread (mentions disabled).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondCommandRequest"
      responses:
        "200":
          description: Delivered or posted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespondedCommand"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /mcp:
    post:
      tags: [mcp]
      operationId: postMcp
      summary: Model Context Protocol endpoint (Streamable HTTP)
      description: |
        MCP over Streamable HTTP, for AI agents. Needs an app token with the `mcp` scope
        (`403` without it, and for browser sessions). The body is one JSON-RPC 2.0 message
        (`initialize`, `tools/list`, `tools/call`, ...); a request is answered with one
        JSON-RPC response (`200`, `application/json`), a notification or response with
        `202`. The transport is stateless: no `Mcp-Session-Id` is issued, and `GET` and
        `DELETE` answer `405`. Tools run as the token's bot user and need further scopes
        (`messages:read`, `messages:write`, `alerts:write`); a missing scope or a refused
        action is a tool result with `isError: true`, not an HTTP error. See `docs/mcp.md`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A JSON-RPC 2.0 message.
      responses:
        "200":
          description: The JSON-RPC response.
          content:
            application/json:
              schema:
                type: object
                description: A JSON-RPC 2.0 response.
        "202":
          description: The message needed no response.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /alerts:
    post:
      tags: [alerts]
      operationId: postAlert
      summary: Post or update an alert
      description: |
        Needs an app token with `alerts:write`; the app's bot must be a member of the target
        channel (and the token's channel allowlist must admit it), else `404`. `channel` is a
        channel name (a leading `#` is ignored) or id.

        `dedupe_key` identifies the condition. With no un-resolved alert for `(app,
        dedupe_key)` a new `alert` message is created (`201`, transition `created`,
        event `message.created`). Otherwise the open alert is updated (`200`): occurrences
        grow, the severity is raised when higher, the message body is re-rendered, and the
        events `message.updated` and `alert.updated` follow. The transition says whether
        the update can notify: `escalated` (higher severity), `renotify_due` (the alert is
        open, not acknowledged and its last notification is older than `renotify_after_s`,
        default the `alert_renotify_s` setting, 0 = never) or `updated_other`. An alert
        resolved earlier does not match: the same key then opens a new alert. A key that
        is open in another channel is `409`.

        Limited to 60 alerts per minute per app (burst 20).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "200":
          description: The open alert with this key was updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostedAlert"
        "201":
          description: A new alert was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostedAlert"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alerts
      description: >-
        Alert messages, newest first, from the channels the caller is a member of (an app
        token: and in its allowlist; it needs `alerts:write` or `messages:read`). Pass
        `next_cursor` as `cursor` for the next page.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: state
          in: query
          description: Only alerts in this state.
          schema:
            type: string
            enum: [open, acked, resolved]
        - name: channel_id
          in: query
          description: Only alerts of this channel.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of alert messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Internal"

  /alerts/resolve:
    post:
      tags: [alerts]
      operationId: resolveAlertByKey
      summary: Resolve the app's alert by dedupe key
      description: >-
        Needs an app token with `alerts:write`. Resolves the app's open alert with this key
        and posts "Resolved by <app>: <text>" in the alert's thread. Idempotent: when the
        latest alert with the key is resolved already it is returned unchanged; a key the
        app never posted is `404`. Counts against the per-app alert limit.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveAlertByKeyRequest"
      responses:
        "200":
          description: The resolved alert message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
