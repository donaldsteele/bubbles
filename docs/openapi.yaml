  /admin/reset:
    post:
      tags: [admin]
      operationId: resetServer
      summary: Clear content or factory reset the server
      description: |-
        Admin only, browser session only (app and device tokens are refused), Origin-checked.
        `confirm` must equal the instance name and `password` is the admin's own password; a
        wrong one is `403` and is audited (`system.reset_denied`). Every attempt counts: 3 per
        hour per admin, then `429`. The `web_reset_enabled` setting turns this endpoint off
        (`403`); `bubbles reset` on the server console always works.

        While the reset runs every request except `GET /healthz` answers `503`
        `{"error":{"code":"unavailable","message":"resetting"}}` with `Retry-After: 5`, and every
        WebSocket is closed with `4011` (content) or `4010` (factory).

        - `content` deletes every message (threads and system messages included), reaction, pin,
          mention, alert, file, the search index and the event history, resets unread state and
          bumps the instance `epoch`. Accounts, sessions, channels, memberships, apps, tokens,
          webhooks, invites and settings stay. Answer: `ContentCleared`.
        - `factory` wipes the data directory (database, Web Push keys, logs, backups, uploads)
          and returns the server to the setup wizard under a new `instance_id`. The CA is kept
          unless `rotate_ca`; settings are dropped unless `keep_settings`. Answer:
          `FactoryReset`, with the new one-time setup token for the admin who ran it.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetRequest"
      responses:
        "200":
          description: The reset is complete.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContentCleared"
                  - $ref: "#/components/schemas/FactoryReset"
