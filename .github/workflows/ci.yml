name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: gofmt
        shell: bash
        run: bash scripts/gofmt-check.sh

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: race test
        if: matrix.os != 'windows-latest'
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

      - name: smoke (serve, CA download, HTTPS healthz, HTTP redirect)
        shell: bash
        run: bash scripts/smoke-serve.sh

      - name: cross-build (6 targets, CGO_ENABLED=0)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/bubbles || exit 1
          done

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm --prefix web ci

      - name: check
        run: npm --prefix web run check

      - name: test
        run: npm --prefix web run test

      - name: build
        run: npm --prefix web run build

  # Playwright specs in tests/e2e build and start their own server (-tags e2e)
  # per spec file, so this job only needs Go, Node and the browsers. The suite
  # runs in Chromium, WebKit and Firefox; service worker specs are Chromium-only.
  e2e:
    name: e2e (playwright, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm --prefix web ci

      - name: build the web app (embedded in the server)
        run: npm --prefix web run build

      - name: install browsers
        run: npx --prefix web playwright install --with-deps chromium webkit firefox

      - name: end-to-end and accessibility specs
        run: npm --prefix web run test:e2e

      - name: upload traces and reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  # The tray app is a separate module (tray/go.mod, Wails v3). CGO is allowed
  # here and only here; the server job above never builds it.
  tray:
    name: tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: tray
    # Wails v3 builds against GTK 4 on Linux unless told otherwise; the tray
    # targets GTK 3 and WebKitGTK 4.1, so every go command there needs the tag.
    env:
      GOFLAGS: ${{ matrix.os == 'ubuntu-latest' && '-tags=gtk3' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum
            tray/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tray/frontend/package-lock.json

      - name: system libraries (GTK 3 and WebKitGTK 4.1)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install wails3 (version pinned in tray/go.mod)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: vet
        run: |
          go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            wails3 build EXTRA_TAGS=gtk3
          else
            wails3 build
          fi
