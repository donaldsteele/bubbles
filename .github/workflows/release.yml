name: release

# Runs only when a version tag is pushed (v1.2.3, v1.2.3-rc1, ...).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  guard:
    name: guard (module path)
    runs-on: ubuntu-latest
    outputs:
      has_tray: ${{ steps.detect.outputs.has_tray }}
    steps:
      - uses: actions/checkout@v7

      - name: refuse placeholder module path
        shell: bash
        run: |
          module_line="$(grep -m1 '^module ' go.mod)"
          echo "$module_line"
          if [[ "$module_line" == *your-org* ]]; then
            echo "::error::go.mod still uses the placeholder module path. Run scripts/set-module-path.ps1 -Module github.com/<owner>/bubbles and push again."
            exit 1
          fi

      - name: detect tray module
        id: detect
        shell: bash
        run: |
          if [ -f tray/go.mod ]; then
            echo "has_tray=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tray=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: web (build once)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        run: npm --prefix web ci

      - name: build
        run: npm --prefix web run build

      - name: upload embedded UI
        uses: actions/upload-artifact@v7
        with:
          name: webui-dist
          path: internal/webui/dist
          if-no-files-found: error
          retention-days: 7

  server:
    name: server zips
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true

      - name: download embedded UI
        uses: actions/download-artifact@v8
        with:
          name: webui-dist
          path: internal/webui/dist

      - name: build 6 targets, zips and SHA256SUMS
        shell: bash
        env:
          BUBBLES_VERSION: ${{ github.ref_name }}
        run: bash scripts/build.sh --skip-web

      - name: verify artifacts
        shell: bash
        run: |
          count="$(ls dist/*.zip | wc -l | tr -d ' ')"
          test "$count" -eq 6 || { echo "expected 6 zips, found $count"; exit 1; }
          test -f dist/SHA256SUMS
          sha256sum --check --quiet dist/SHA256SUMS

      - name: upload server artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-release
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  tray:
    name: tray (${{ matrix.os }})
    needs: guard
    if: needs.guard.outputs.has_tray == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: |
            go.sum
            tray/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: tray/frontend/package-lock.json

      - name: system libraries (GTK 3 and WebKitGTK 4.1)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install wails3 (version pinned in tray/go.mod)
        shell: bash
        working-directory: tray
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@"$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"

      - name: build the tray app
        shell: bash
        working-directory: tray
        run: |
          case "$RUNNER_OS" in
            Linux)   wails3 build EXTRA_TAGS=gtk3 ;;
            macOS)   wails3 package ;;
            Windows) wails3 build ;;
          esac

      - name: zip and checksum
        shell: bash
        working-directory: tray
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Linux)
              name="bubbles-tray_${REF_NAME}_linux_amd64.zip"
              (cd bin && zip -9 "../out/$name" bubbles-tray)
              ;;
            macOS)
              name="bubbles-tray_${REF_NAME}_macos_$(uname -m).zip"
              ditto -c -k --keepParent bin/bubbles-tray.app "out/$name"
              ;;
            Windows)
              name="bubbles-tray_${REF_NAME}_windows_amd64.zip"
              (cd bin && 7z a -tzip -mx=9 "../out/$name" bubbles-tray.exe)
              ;;
          esac
          (cd out && { sha256sum "$name" 2>/dev/null || shasum -a 256 "$name"; } > "$name.sha256")
          ls -l out

      - name: upload tray artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tray-${{ matrix.os }}
          path: tray/out/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: docker image (linux/amd64, linux/arm64)
    needs: [guard, server]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: lowercase owner for ghcr.io
        id: owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: image tags
        id: tags
        shell: bash
        env:
          OWNER: ${{ steps.owner.outputs.owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${OWNER}/bubbles"
          tags="${image}:${REF_NAME}"
          # Pre-release tags (v1.2.0-rc1) do not move :latest.
          if [[ "$REF_NAME" != *-* ]]; then
            tags="${tags}"$'\n'"${image}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}

  release:
    name: github release
    needs: [guard, server, docker, tray]
    if: >-
      ${{ !cancelled() && needs.server.result == 'success' && needs.docker.result == 'success'
        && (needs.tray.result == 'success' || needs.tray.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: download server artifacts
        uses: actions/download-artifact@v8
        with:
          name: server-release
          path: dist

      - name: download tray artifacts
        if: needs.tray.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: tray-*
          merge-multiple: true
          path: dist

      - name: create release
        shell: bash
        run: |
          prerelease=()
          if [[ "$REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$REF_NAME" dist/* \
            --title "bubbles $REF_NAME" \
            --generate-notes \
            "${prerelease[@]}"
